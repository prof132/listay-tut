<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102448">
<title>Листай тут! — Жизнь в кадрах</title>
<meta name="description" content="Весёлые истории: рыбалка, семья, работа и джек-рассел. Листайте комикс стрелками и свайпами.">
<meta property="og:type" content="website"><meta property="og:title" content="ЛИСТАЙ ТУТ! — Жизнь в кадрах"><meta property="og:description" content="10 весёлых историй в одном комиксе. Откройте и листайте!"><meta property="og:image" content="preview.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#081834;color:#fff;font-family:system-ui,-apple-system,Arial,sans-serif}body{overflow:hidden}.app{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 5px env(safe-area-inset-bottom)}.viewer{position:relative;min-height:0;max-height:calc(100% - 43px);width:100%;flex:1;display:flex;justify-content:center;align-items:center}.viewer img{display:block;max-height:100%;max-width:100%;height:100%;width:auto;object-fit:contain;user-select:none;-webkit-user-drag:none}.nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:55px;border:0;color:#fff;background:#07182bb3;border-radius:10px;font-size:28px;cursor:pointer;z-index:2}.nav.left{left:3px}.nav.right{right:3px}.nav:disabled{opacity:.15}.controls{height:43px;flex:0 0 43px;display:flex;align-items:center;gap:12px;justify-content:center;font-size:12px;color:#dae5ff}.controls strong{font-size:13px;color:#fff}.label{max-width:65vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls button{padding:4px 9px;border:1px solid #8294c0;background:transparent;color:#fff;border-radius:5px;cursor:pointer}@media(min-width:800px){.viewer{max-width:600px}.nav.left{left:0}.nav.right{right:0}}
</style></head><body><main class="app"><div class="viewer" id="viewer"><button class="nav left" id="prev" aria-label="Назад">‹</button><img id="picture" src="cover.jpg" alt="Обложка комикса"><button class="nav right" id="next" aria-label="Вперёд">›</button></div><div class="controls"><span id="count">1 / 11</span><strong class="label" id="label">Обложка</strong><button id="fullscreen" aria-label="Полный экран">⛶</button></div></main>
<script>
const slides=[{"name": "Обложка", "file": "cover.jpg"}, {"name": "Летняя рыбалка", "file": "page-01.jpg"}, {"name": "Зимняя рыбалка", "file": "page-02.jpg"}, {"name": "Невероятный улов", "file": "page-03.jpg"}, {"name": "Семья на кухне", "file": "page-04.jpg"}, {"name": "Прогулка с джек-расселом", "file": "page-05.jpg"}, {"name": "Рабочее совещание", "file": "page-06.jpg"}, {"name": "Совещание на производстве", "file": "page-07.jpg"}, {"name": "Семья у Москва-Сити", "file": "page-08.jpg"}, {"name": "Семья в путешествии", "file": "page-09.jpg"}, {"name": "Кому снится прогулка?", "file": "page-10.jpg"}];
let i=0;const img=document.getElementById('picture'),label=document.getElementById('label'),count=document.getElementById('count');
function show(n){i=Math.max(0,Math.min(slides.length-1,n));img.src=slides[i].file;img.alt=slides[i].name;label.textContent=slides[i].name;count.textContent=(i+1)+' / '+slides.length;document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===slides.length-1;}
document.getElementById('prev').onclick=()=>show(i-1);document.getElementById('next').onclick=()=>show(i+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(i+1);if(e.key==='ArrowLeft')show(i-1)});
let tx=0,ty=0;const viewer=document.getElementById('viewer');viewer.addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX;ty=e.changedTouches[0].clientY},{passive:true});viewer.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.25)show(i+(dx<0?1:-1))},{passive:true});
document.getElementById('fullscreen').onclick=()=>{if(document.fullscreenElement){document.exitFullscreen?.()}else{document.documentElement.requestFullscreen?.()}};show(0);
</script></body></html>
